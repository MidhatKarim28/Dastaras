<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Dastaras — trusted home services in Pakistan, within reach">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b3a"/>
      <stop offset="0.6" stop-color="#0f2a30"/>
      <stop offset="1" stop-color="#1c2b22"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.85" cy="0" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.05" cy="1.1" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glowTeal)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glowAmber)"/>

  <!-- logo mark -->
  <g transform="translate(96 92)">
    <rect width="88" height="88" rx="22" fill="#34d399"/>
    <path d="M18 48 44 26l26 22v22a3 3 0 0 1-3 3H54V56H34v17H21a3 3 0 0 1-3-3V48Z" fill="none" stroke="#062a26" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="67" cy="24" r="7" fill="#fbbf24"/>
  </g>

  <text x="212" y="152" fill="#f0fdfa" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">Dastaras</text>
  <text x="500" y="150" fill="#99f6e4" fill-opacity="0.85" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, Segoe UI, Tahoma, sans-serif" font-size="42">دسترس</text>

  <text x="214" y="196" fill="#ccfbf1" fill-opacity="0.9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="24">Trusted home services in Pakistan, <tspan fill="#fbbf24" font-weight="600">within reach.</tspan></text>

  <!-- service chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#e6fffa">
    <rect x="214" y="224" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="262" y="245" text-anchor="middle">Cleaning</text>
    <rect x="320" y="224" width="100" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="370" y="245" text-anchor="middle">Electrical</text>
    <rect x="430" y="224" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="478" y="245" text-anchor="middle">AC repair</text>
    <rect x="536" y="224" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="584" y="245" text-anchor="middle">Plumbing</text>
    <rect x="642" y="224" width="130" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="707" y="245" text-anchor="middle">Personal care</text>
  </g>

  <!-- booking card motif -->
  <g transform="translate(880 64)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect width="300" height="192" rx="18" fill="#0b1f22" fill-opacity="0.85" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <circle cx="40" cy="44" r="20" fill="#134e4a"/>
    <text x="40" y="50" text-anchor="middle" fill="#5eead4" font-size="15" font-weight="700">SM</text>
    <text x="72" y="40" fill="#f0fdfa" font-size="16" font-weight="600">AC service &amp; gas refill</text>
    <text x="72" y="60" fill="#94a3b8" font-size="13">Gulberg, Lahore · ★ 4.9</text>
    <line x1="20" x2="280" y1="84" y2="84" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="112" fill="#94a3b8" font-size="13">Sat, 10:00 AM · 2 hours</text>
    <text x="20" y="140" fill="#f0fdfa" font-size="20" font-weight="700">Rs 3,000</text>
    <rect x="176" y="120" width="104" height="30" rx="15" fill="#34d399" fill-opacity="0.18"/>
    <circle cx="194" cy="135" r="4" fill="#34d399"/>
    <text x="236" y="140" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">Confirmed</text>
    <text x="20" y="176" fill="#64748b" font-size="12">Price locked when requested</text>
  </g>
</svg>
